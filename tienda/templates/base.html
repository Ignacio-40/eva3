<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tienda de Juegos de Mesa{% endblock %}</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'catalogo' %}">🎲 Juegos de Mesa</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'catalogo' %}">Catálogo</a>
                <a class="nav-link" href="/admin/">Administración</a>
            </div>
        </div>
    </nav>

    <main class="container mb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">Tienda de Juegos de Mesa &copy; 2026</p>
    </footer>

    <script src="https://jsdelivr.net"></script>
</body>
</html>
